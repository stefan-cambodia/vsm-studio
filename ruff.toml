# Lint Python (analyse/, tools/) : `ruff check .` depuis la racine.
# Le jeu de règles est celui que les `# noqa` du code visaient déjà :
# pyflakes, les erreurs pycodestyle, bugbear ; pas de règle de style.
extend-exclude = ["build", "build-*", "build-reed", "build-bench"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "RUF059"]
