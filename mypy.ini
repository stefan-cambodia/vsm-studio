# Vérification de types Python (analyse/, tools/), depuis la racine :
#
#     analyse/.venv/bin/python -m mypy analyse tools
#
# Le vérificateur n'est pas dans `analyse/requirements.txt` : c'est un outil
# d'atelier, pas une dépendance de la chaîne. Il s'installe à part, comme ruff :
#
#     analyse/.venv/bin/python -m pip install mypy
#
# CE QUE LA VÉRIFICATION EXIGE. Les corps de fonctions NON annotées ne sont pas
# visités (c'est le défaut de mypy, gardé tel quel) : la règle est « ce qui est
# annoté doit être vrai », pas « tout doit être annoté ». Une annotation est
# donc une promesse, et le vérificateur la tient — c'est ainsi qu'il a trouvé
# les deux fonctions dont le type de retour mentait sur ce qu'elles rendent
# (`try_cutoff_automation` rendait un quadruplet annoncé triplet,
# `mesurer_transcription` un quadruplet annoncé dictionnaire).
#
# `Any` PLUTÔT QUE `object` AUX FRONTIÈRES. Ce qui traverse une frontière non
# typée — une réponse JSON du moteur, un estimateur scikit-learn, un nœud de
# `rapport.json`, un sac de mots-clés passé par `**` — s'annote `Any`. `object`
# n'apporte aucune garantie de plus (il ne dit pas ce que la valeur EST) et
# interdit tout usage : il produisait l'essentiel des cent quarante-huit
# signalements du 09/09/2026 sans jamais désigner un défaut.
#
# Les paquets scientifiques (librosa, soundfile, demucs, sklearn, mido…) n'ont
# pas d'annotations distribuées : leurs imports ne sont pas une erreur.

[mypy]
ignore_missing_imports = True
exclude = (^|/)(\.venv|build|build-.*|__pycache__)/
